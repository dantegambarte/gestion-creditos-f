# Static deploy of the Angular 18 application builder output.
# The builder emits dist/gestion-creditos-f/{browser,server}; only browser/ is
# servable by Netlify's CDN. The Express server (server.ts) is not used here.
[build]
  # API_BASE_URL must be set in the Netlify site environment variables, never in the repo.
  command = "node scripts/set-api-url.mjs && pnpm run build --configuration production"
  publish = "dist/gestion-creditos-f/browser"

[build.environment]
  # pnpm 11 (packageManager in package.json) needs Node 22.13+; "22" resolves
  # to the latest 22.x. Matches CI (.nvmrc).
  NODE_VERSION = "22"
  # Netlify installs with pnpm (pnpm-lock.yaml + packageManager); never re-resolve.
  PNPM_FLAGS = "--frozen-lockfile"

# index.html is prerendered (login markup); protected/portal routes must boot
# from the pure CSR shell, same as server.ts does.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
