<p-dialog
  [(visible)]="visible"
  header="Aplicar mora"
  [modal]="true"
  [style]="{ width: '380px' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="close()"
>
  <div class="flex flex-col gap-4 py-2">
    <p class="text-sm" style="color: var(--ff-text-primary)">
      Cliente: <strong>{{ row?.clientName }}</strong> · Cuota #{{
        row?.installmentNumber
      }}
    </p>
    <div class="flex flex-col gap-1">
      <label class="auth-label">Monto de mora</label>
      <input
        type="number"
        [(ngModel)]="applyAmount"
        min="0.01"
        step="0.01"
        class="w-full rounded-xl p-3 text-sm outline-none"
        style="
          border: 1px solid var(--ff-border);
          background: var(--ff-secondary);
          color: var(--ff-text-primary);
        "
        placeholder="0.00"
      />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="grid grid-cols-2 gap-3 w-full">
      <p-button
        type="button"
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        styleClass="w-full h-11 px-5 rounded-xl justify-center"
        (onClick)="close()"
      />
      <p-button
        label="Aplicar"
        severity="warning"
        styleClass="w-full h-11 px-5 rounded-xl justify-center"
        (onClick)="confirmApply()"
        [loading]="loading"
        [disabled]="!applyAmount || applyAmount <= 0"
      />
    </div>
  </ng-template>
</p-dialog>
