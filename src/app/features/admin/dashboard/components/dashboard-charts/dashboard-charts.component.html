<div class="db-analysis-row">
  <!-- Weekly collection -->
  <div class="db-chart-panel">
    <div class="db-panel__header">
      <span>Recaudación semana</span>
    </div>
    @if (loadingCharts) {
      <div style="height: 250px; display: flex; align-items: center; justify-content: center;">
        <p-skeleton width="100%" height="250px" />
      </div>
    } @else {
      <p-chart type="bar" [data]="chartWeeklyData" [options]="chartWeeklyOptions" style="height: 250px;" />
    }
  </div>

  <!-- Collectors ranking -->
  <div class="db-chart-panel">
    <div class="db-panel__header">
      <span>Top 5 cobradores</span>
    </div>
    @if (loadingCharts) {
      <div style="height: 250px; display: flex; align-items: center; justify-content: center;">
        <p-skeleton width="100%" height="250px" />
      </div>
    } @else {
      <p-chart type="bar" [data]="chartCollectorsData" [options]="chartCollectorsOptions" style="height: 250px;" />
    }
  </div>

  <!-- Sellers ranking -->
  <div class="db-chart-panel">
    <div class="db-panel__header">
      <span>Top 5 vendedores</span>
    </div>
    @if (loadingCharts) {
      <div style="height: 250px; display: flex; align-items: center; justify-content: center;">
        <p-skeleton width="100%" height="250px" />
      </div>
    } @else {
      <p-chart type="bar" [data]="chartSellersData" [options]="chartSellersOptions" style="height: 250px;" />
    }
  </div>
</div>
