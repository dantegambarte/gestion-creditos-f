<p-dialog
  header="Abrir caja operativa"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!submitting"
  (visibleChange)="visibleChange.emit($event)"
  [style]="{ width: '420px' }"
>
  <div class="flex flex-col gap-3">
    <p class="text-sm text-gray-600">
      Abrí la caja operativa del turno. En V4 solo puede haber una caja
      <strong>OPEN</strong> simultánea por jornada.
    </p>

    <div>
      <label class="block text-sm font-medium mb-1" for="opening-amount">
        Monto inicial (efectivo)
      </label>
      <p-inputNumber
        inputId="opening-amount"
        [(ngModel)]="openingAmount"
        mode="currency"
        currency="ARS"
        appCurrencyAmountInput
        [min]="0"
        [showButtons]="false"
        class="w-full"
      ></p-inputNumber>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1" for="shift-label">
        Etiqueta del turno <span class="text-gray-400">(opcional)</span>
      </label>
      <input
        pInputText
        id="shift-label"
        [(ngModel)]="shiftLabel"
        placeholder="Mañana / Tarde / Noche"
        maxlength="40"
        class="w-full"
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1" for="observations">
        Observaciones <span class="text-gray-400">(opcional)</span>
      </label>
      <textarea
        pInputTextarea
        id="observations"
        [(ngModel)]="observations"
        rows="2"
        maxlength="500"
        class="w-full"
      ></textarea>
    </div>

    @if (errorMessage) {
      <div class="text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2">
        {{ errorMessage }}
      </div>
    }
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      label="Cancelar"
      class="p-button-text"
      [disabled]="submitting"
      (click)="close()"
    ></button>
    <button
      pButton
      label="Abrir caja"
      icon="pi pi-check"
      [loading]="submitting"
      [disabled]="!canSubmit()"
      (click)="submit()"
    ></button>
  </ng-template>
</p-dialog>
