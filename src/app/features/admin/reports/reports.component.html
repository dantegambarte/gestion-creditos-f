<div class="p-6 space-y-6">
  <div class="mb-6 flex gap-1 border-b border-gray-200 overflow-x-auto">
    @for (tab of TABS; track tab.id) {
      <button
        (click)="setTab(tab.id)"
        [class]="
          'flex items-center gap-2 px-4 py-2.5 text-sm font-medium border-b-2 whitespace-nowrap transition-colors ' +
          (activeTab === tab.id
            ? 'border-blue-600 text-blue-600'
            : 'border-transparent text-gray-500 hover:text-gray-700')
        "
      >
        <i [class]="tab.icon + ' text-xs'"></i>
        {{ tab.label }}
      </button>
    }
  </div>

  @if (activeTab === "summary") {
    <app-summary-report />
  }
  @if (activeTab === "collection") {
    <app-collection-report />
  }
  @if (activeTab === "portfolio") {
    <app-portfolio-report />
  }
  @if (activeTab === "overdue") {
    <app-overdue-report />
  }
  @if (activeTab === "collectors") {
    <app-collectors-report />
  }
  @if (activeTab === "products") {
    <app-products-report />
  }
  @if (activeTab === "upcoming") {
    <app-upcoming-report />
  }
</div>
