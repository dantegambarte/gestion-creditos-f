<div class="flex flex-col h-full">
  <div class="px-6 pt-6">
    <div class="ff-page-header mb-4">
      <div>
        <h1 class="ff-page-title">Configuración</h1>
        <p class="ff-page-subtitle">Parámetros generales, tasas, feriados y usuarios.</p>
      </div>
    </div>
  </div>

  <!-- Tab nav -->
  <nav class="ff-tab-nav px-6 pt-4">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="ff-tab--active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="ff-tab rounded-t-lg"
      >
        <i [class]="item.icon + ' text-sm'"></i>
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto p-6">
    <router-outlet />
  </div>
</div>
