<div class="flex flex-col h-full" data-cy="admin-config-page">
  <div class="px-4 pt-4 md:px-6 md:pt-6">
    <div class="ff-page-header mb-4">
      <div>
        <h1 class="ff-page-title">Configuración</h1>
        <p class="ff-page-subtitle">Parámetros generales, tasas, feriados y usuarios.</p>
      </div>
    </div>
  </div>

  <!-- Tab nav -->
  <nav
    class="ff-tab-nav config-mobile-tabs px-4 pt-4 md:px-6"
    data-cy="admin-config-tabs"
  >
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="ff-tab--active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="ff-tab rounded-t-lg"
      >
        <i [class]="item.icon + ' text-sm'"></i>
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto p-4 md:p-6">
    <router-outlet />
  </div>
</div>
