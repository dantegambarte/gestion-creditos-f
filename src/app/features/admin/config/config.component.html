<div class="flex flex-col h-full">
  <!-- Tab nav -->
  <nav
    class="flex items-end gap-1 border-b border-slate-800 px-6 pt-4 overflow-x-auto"
  >
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="border-b-2 border-blue-500 text-slate-100 bg-slate-800/40"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-2 px-4 py-2.5 rounded-t-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/30 transition-colors whitespace-nowrap border-b-2 border-transparent"
      >
        <i [class]="item.icon + ' text-sm'"></i>
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto p-6">
    <router-outlet />
  </div>
</div>
