<div class="space-y-6">
  @if (loadError) {
    <div
      class="flex flex-wrap items-start gap-2 rounded-xl border border-red-300 bg-red-50 p-3 text-sm text-red-800"
      role="alert"
      data-cy="company-config-load-error"
    >
      <i class="pi pi-exclamation-triangle shrink-0 mt-0.5"></i>
      <span class="min-w-0 flex-1">{{ loadError }}</span>
      <p-button label="Reintentar" [text]="true" size="small" (onClick)="load()" />
    </div>
  }
  <!-- Card: Datos de la Empresa -->
  <div class="ff-panel border p-6 space-y-6">
    <div class="flex items-center gap-3 pb-4 border-b" style="border-color: var(--ff-border)">
      <div class="w-9 h-9 rounded-xl bg-blue-600/20 flex items-center justify-center">
        <i class="pi pi-building text-blue-400 text-base"></i>
      </div>
      <div>
        <h2 class="text-base font-semibold ff-text-primary">Datos de la Empresa</h2>
        <p class="text-xs ff-text-muted">Información general del sistema</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="flex flex-col gap-1.5">
        <label class="auth-label">Nombre del sistema</label>
        <input
          pInputText
          [(ngModel)]="systemName"
          class="w-full h-11 px-3.5"
          data-cy="company-config-name"
          [disabled]="loading || !!loadError"
        />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="auth-label">Email de contacto</label>
        <input
          pInputText
          type="email"
          [(ngModel)]="contactEmail"
          class="w-full h-11 px-3.5"
          data-cy="company-config-email"
          [disabled]="loading || !!loadError"
        />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="auth-label">Teléfono</label>
        <input
          pInputText
          [(ngModel)]="phone"
          class="w-full h-11 px-3.5"
          data-cy="company-config-phone"
          [disabled]="loading || !!loadError"
        />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="auth-label">Dirección</label>
        <input
          pInputText
          [(ngModel)]="address"
          class="w-full h-11 px-3.5"
          data-cy="company-config-address"
          [disabled]="loading || !!loadError"
        />
      </div>
    </div>
  </div>

  <!-- Card: Tasas de Interés -->
  <div class="ff-panel border p-6 space-y-6">
    <div class="flex items-center gap-3 pb-4 border-b" style="border-color: var(--ff-border)">
      <div class="w-9 h-9 rounded-xl bg-emerald-600/20 flex items-center justify-center">
        <i class="pi pi-percentage text-emerald-400 text-base"></i>
      </div>
      <div>
        <h2 class="text-base font-semibold ff-text-primary">Tasas de Interés</h2>
        <p class="text-xs ff-text-muted">
          Mora, comisión y gracia son las que usa el sistema; VENTA y PRÉSTAMO son de referencia.
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="flex flex-col gap-1.5">
        <label class="auth-label">Tasa VENTA (mensual)</label>
        <p-inputNumber
          [(ngModel)]="saleRate"
          [min]="0"
          [max]="100"
          [maxFractionDigits]="3"
          suffix="%"
          locale="es-AR"
          styleClass="w-full"
          inputStyleClass="w-full h-11"
          data-cy="company-config-sale-rate"
          [disabled]="loading || !!loadError"
        />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="auth-label">Tasa PRÉSTAMO (mensual)</label>
        <p-inputNumber
          [(ngModel)]="loanRate"
          [min]="0"
          [max]="100"
          [maxFractionDigits]="3"
          suffix="%"
          locale="es-AR"
          styleClass="w-full"
          inputStyleClass="w-full h-11"
          data-cy="company-config-loan-rate"
          [disabled]="loading || !!loadError"
        />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="auth-label">Tasa MORA (diaria)</label>
        <p-inputNumber
          [(ngModel)]="moraRate"
          [min]="0"
          [max]="50"
          [maxFractionDigits]="3"
          suffix="%"
          locale="es-AR"
          styleClass="w-full"
          inputStyleClass="w-full h-11"
          data-cy="company-config-mora-rate"
          [disabled]="loading || !!loadError"
        />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="auth-label">Comisión Vendedor</label>
        <p-inputNumber
          [(ngModel)]="sellerCommission"
          [min]="0"
          [max]="100"
          [maxFractionDigits]="3"
          suffix="%"
          locale="es-AR"
          styleClass="w-full"
          inputStyleClass="w-full h-11"
          data-cy="company-config-commission"
          [disabled]="loading || !!loadError"
        />
      </div>
    </div>

    <div
      class="flex flex-wrap items-center gap-3 pt-2 border-t"
      style="border-color: var(--ff-border)"
    >
      <label class="text-sm ff-text-secondary whitespace-nowrap">Período de gracia:</label>
      <p-inputNumber
        [(ngModel)]="gracePeriod"
        [min]="0"
        [max]="30"
        inputStyleClass="w-24 h-11 text-center"
        data-cy="company-config-grace"
        [disabled]="loading || !!loadError"
      />
      <span class="min-w-0 text-sm ff-text-muted">días (0 a 30).</span>
    </div>
  </div>

  <!-- Acciones -->
  <div class="flex justify-end">
    <p-button
      label="Guardar cambios"
      icon="pi pi-save"
      iconPos="left"
      severity="primary"
      styleClass="h-11 px-5 rounded-xl shadow-sm"
      data-cy="company-config-save"
      [loading]="saving"
      [disabled]="loading || saving || !!loadError"
      (onClick)="save()"
    />
  </div>
</div>
