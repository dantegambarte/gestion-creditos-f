<div class="space-y-4">
  <!-- Toolbar -->
  <div class="flex items-center gap-3">
    <div class="relative">
      <i
        class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 ff-muted-icon text-sm z-10"
      ></i>
      <input
        pInputText
        type="text"
        placeholder="Buscar por nombre, email o DNI..."
        [value]="searchQuery()"
        (input)="onSearch($any($event.target).value)"
        class="w-80 h-9 rounded-md pl-9 pr-3 text-sm"
      />
    </div>

    <p-dropdown
      [options]="roleOptions"
      optionLabel="label"
      optionValue="value"
      [filter]="roleOptions.length > 10"
      filterBy="label"


      [ngModel]="selectedRole()"
      (ngModelChange)="onRoleChange($event)"
      styleClass="w-48 h-9 rounded-md text-sm [&_.p-dropdown-label]:flex [&_.p-dropdown-label]:items-center [&_.p-dropdown-label]:py-0 [&_.p-dropdown-label]:leading-tight [&_.p-dropdown-label]:truncate"
      appendTo="body"
    />

    <div class="ml-auto">
      <p-button
        label="+ Nuevo Usuario"
        severity="primary"
        styleClass="h-11 px-5 rounded-xl shadow-sm"
        (onClick)="openNew()"
      />
    </div>
  </div>

  <!-- Table -->
  <div class="ff-panel border overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b" style="border-color: var(--ff-border)">
          <th
            class="px-5 py-3 text-left text-xs font-semibold ff-text-muted uppercase tracking-wide"
          >
            Avatar + Nombre
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold ff-text-muted uppercase tracking-wide"
          >
            Email
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold ff-text-muted uppercase tracking-wide"
          >
            DNI
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold ff-text-muted uppercase tracking-wide"
          >
            Rol
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold ff-text-muted uppercase tracking-wide"
          >
            Estado
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold ff-text-muted uppercase tracking-wide"
          >
            Último acceso
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold ff-text-muted uppercase tracking-wide"
          >
            Acciones
          </th>
        </tr>
      </thead>
      <tbody>
        @for (user of filteredUsers(); track user.id) {
          <tr
            class="border-b transition-colors"
            style="border-color: var(--ff-border-subtle)"
          >
            <td class="px-5 py-3">
              <div class="flex items-center gap-3">
                <div
                  [class]="
                    'w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-semibold flex-shrink-0 ' +
                    avatarColor(user.name)
                  "
                >
                  {{ initials(user.name) }}
                </div>
                <span class="font-medium ff-text-primary">{{ user.name }}</span>
              </div>
            </td>
            <td class="px-5 py-3 ff-text-secondary">{{ user.email }}</td>
            <td class="px-5 py-3 ff-text-secondary">{{ user.dni }}</td>
            <td class="px-5 py-3">
              <p-tag
                [value]="roleLabel(user.role)"
                [severity]="roleSeverity(user.role)"
                styleClass="text-xs"
              />
            </td>
            <td class="px-5 py-3">
              <p-tag
                [value]="user.active ? 'Activo' : 'Inactivo'"
                [severity]="user.active ? 'success' : 'secondary'"
                styleClass="text-xs"
              />
            </td>
            <td class="px-5 py-3 ff-text-muted text-xs">
              {{ user.lastLogin }}
            </td>
            <td class="px-5 py-3">
              <button
                (click)="openEdit(user)"
                class="text-sm text-blue-400 hover:text-blue-300 transition-colors"
              >
                Editar
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="8" class="px-5 py-10 text-center ff-text-muted">
              No se encontraron usuarios.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<app-user-form-modal
  [(visible)]="modalVisible"
  [editRecord]="editingUser"
  (saved)="onSaved($event)"
/>
