<div class="space-y-4">
  <!-- Toolbar -->
  <div class="flex items-center gap-3">
    <div class="relative">
      <i
        class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm z-10"
      ></i>
      <input
        type="text"
        placeholder="Buscar por nombre, email o DNI..."
        [value]="searchQuery()"
        (input)="onSearch($any($event.target).value)"
        class="pl-9 pr-4 h-10 text-sm bg-slate-800/60 border border-slate-700 text-slate-100 placeholder-slate-500 rounded-xl outline-none focus:border-blue-500 w-64"
      />
    </div>

    <p-dropdown
      [options]="roleOptions"
      optionLabel="label"
      optionValue="value"
      [ngModel]="selectedRole()"
      (ngModelChange)="onRoleChange($event)"
      styleClass="h-10 text-sm rounded-xl"
    />

    <div class="ml-auto">
      <p-button
        label="+ Nuevo Usuario"
        styleClass="h-10 px-5 rounded-xl"
        (onClick)="openNew()"
      />
    </div>
  </div>

  <!-- Table -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-slate-800">
          <th
            class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide"
          >
            Avatar + Nombre
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide"
          >
            Email
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide"
          >
            DNI
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide"
          >
            Rol
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide"
          >
            Sucursal
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide"
          >
            Estado
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide"
          >
            Último acceso
          </th>
          <th
            class="px-5 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide"
          >
            Acciones
          </th>
        </tr>
      </thead>
      <tbody>
        @for (user of filteredUsers(); track user.id) {
          <tr
            class="border-b border-slate-800/50 hover:bg-slate-800/30 transition-colors"
          >
            <td class="px-5 py-3">
              <div class="flex items-center gap-3">
                <div
                  [class]="
                    'w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-semibold flex-shrink-0 ' +
                    avatarColor(user.name)
                  "
                >
                  {{ initials(user.name) }}
                </div>
                <span class="font-medium text-slate-200">{{ user.name }}</span>
              </div>
            </td>
            <td class="px-5 py-3 text-slate-400">{{ user.email }}</td>
            <td class="px-5 py-3 text-slate-400">{{ user.dni }}</td>
            <td class="px-5 py-3">
              <p-tag
                [value]="roleLabel(user.role)"
                [severity]="roleSeverity(user.role)"
                styleClass="text-xs"
              />
            </td>
            <td class="px-5 py-3 text-slate-400">{{ user.branch }}</td>
            <td class="px-5 py-3">
              <p-tag
                [value]="user.active ? 'Activo' : 'Inactivo'"
                [severity]="user.active ? 'success' : 'secondary'"
                styleClass="text-xs"
              />
            </td>
            <td class="px-5 py-3 text-slate-500 text-xs">
              {{ user.lastLogin }}
            </td>
            <td class="px-5 py-3">
              <button
                (click)="openEdit(user)"
                class="text-sm text-blue-400 hover:text-blue-300 transition-colors"
              >
                Editar
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="8" class="px-5 py-10 text-center text-slate-500">
              No se encontraron usuarios.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<app-user-form-modal
  [(visible)]="modalVisible"
  [editRecord]="editingUser"
  (saved)="onSaved($event)"
/>
