<p-toast />

<div class="p-6 space-y-6">
  <div class="ff-page-header mb-0">
    <div>
      <h1 class="ff-page-title">Liquidaciones</h1>
      <p class="ff-page-subtitle">Comisiones, historial y sueldo fijo del equipo.</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="ff-tab-nav">
    <button
      (click)="vm.setTab('resumen')"
      class="ff-tab"
      [class.ff-tab--active]="vm.activeTab() === 'resumen'"
    >
      <i class="pi pi-wallet mr-1.5"></i> Resumen semanal
    </button>
    <button
      (click)="vm.setTab('historial')"
      class="ff-tab"
      [class.ff-tab--active]="vm.activeTab() === 'historial'"
    >
      <i class="pi pi-history mr-1.5"></i> Historial
    </button>
    <button
      (click)="vm.setTab('sueldos')"
      class="ff-tab"
      [class.ff-tab--active]="vm.activeTab() === 'sueldos'"
    >
      <i class="pi pi-money-bill mr-1.5"></i> Sueldo fijo
    </button>
  </div>

  <!-- TAB: Resumen semanal -->
  @if (vm.activeTab() === "resumen") {
    <app-commissions-summary-tab
      [loadingSummary]="vm.loadingSummary()"
      [errorSummary]="vm.errorSummary()"
      [employees]="vm.employees()"
      [loadingLiquidations]="vm.loadingLiquidations()"
      [recentLiquidations]="vm.recentLiquidations()"
      [roleLabel]="vm.roleLabel.bind(vm)"
      [roleTagClass]="vm.roleTagClass.bind(vm)"
      [rowDisabled]="vm.rowDisabled.bind(vm)"
      [formatCurrency]="vm.formatCurrency.bind(vm)"
      [formatDate]="vm.formatDate.bind(vm)"
      [paymentMethodLabel]="vm.paymentMethodLabel.bind(vm)"
      (reloadSummary)="vm.loadSummary()"
      (liquidate)="vm.openLiquidateDialog($event)"
    />
  }

  <!-- TAB: Historial -->
  @if (vm.activeTab() === "historial") {
    <app-commissions-history-tab
      [loadingLiquidations]="vm.loadingLiquidations()"
      [historyRows]="vm.historyRows()"
      [historyStats]="vm.historyStats()"
      [selectedHistory]="vm.selectedHistory()"
      [historyEmployeeFilter]="vm.historyEmployeeFilter()"
      [historyEmployeeOptions]="vm.historyEmployeeOptions()"
      [historyMethodFilter]="vm.historyMethodFilter()"
      [historyMethodOptions]="vm.historyMethodOptions()"
      [roleByUserId]="vm.roleByUserId.bind(vm)"
      [roleClassByUserId]="vm.roleClassByUserId.bind(vm)"
      [formatCurrency]="vm.formatCurrency.bind(vm)"
      [formatDate]="vm.formatDate.bind(vm)"
      [paymentMethodLabel]="vm.paymentMethodLabel.bind(vm)"
      (historyEmployeeFilterChange)="vm.setHistoryEmployeeFilter($event)"
      (historyMethodFilterChange)="vm.setHistoryMethodFilter($event)"
      (historySelected)="vm.selectHistory($event)"
      (historyCleared)="vm.clearSelectedHistory()"
    />
  }

  <!-- TAB: Sueldo fijo -->
  @if (vm.activeTab() === "sueldos") {
    <app-commissions-salaries-tab
      [salaryStats]="vm.salaryStats()"
      [salarySearchTerm]="vm.salarySearchTerm()"
      [filteredSalaryRows]="vm.filteredSalaryRows()"
      [selectedCollectorId]="vm.selectedCollectorId()"
      [collectorOptions]="vm.collectorOptions()"
      [loadingSalary]="vm.loadingSalary()"
      [currentSalary]="vm.currentSalary()"
      [newWeeklyAmount]="vm.newWeeklyAmount()"
      [savingSalary]="vm.savingSalary()"
      [roleLabel]="vm.roleLabel.bind(vm)"
      [roleTagClass]="vm.roleTagClass.bind(vm)"
      [formatCurrency]="vm.formatCurrency.bind(vm)"
      (salarySearchTermChange)="vm.setSalarySearchTerm($event)"
      (selectedCollectorIdChange)="vm.setSelectedCollectorId($event)"
      (collectorChanged)="vm.onCollectorChange()"
      (collectorRowSelected)="vm.selectCollectorFromRow($event)"
      (newWeeklyAmountChange)="vm.setNewWeeklyAmount($event)"
      (salarySaved)="vm.saveSalary()"
    />
  }
</div>

<app-commissions-liquidation-dialogs
  [showLiquidateDialog]="vm.showLiquidateDialog()"
  [showConfirmDialog]="vm.showConfirmDialog()"
  [selectedEmployee]="vm.selectedEmployee()"
  [liquidating]="vm.liquidating()"
  [liquidatePaymentMethod]="vm.liquidatePaymentMethod()"
  [liquidateTransferReference]="vm.liquidateTransferReference()"
  [paymentMethodOptions]="vm.paymentMethodOptions"
  [formatCurrency]="vm.formatCurrency.bind(vm)"
  [employeeCommissions]="vm.employeeCommissions()"
  [loadingCommissions]="vm.loadingCommissions()"
  (showLiquidateDialogChange)="vm.setShowLiquidateDialog($event)"
  (showConfirmDialogChange)="vm.setShowConfirmDialog($event)"
  (liquidatePaymentMethodChange)="vm.setLiquidatePaymentMethod($event)"
  (liquidateTransferReferenceChange)="vm.setLiquidateTransferReference($event)"
  (openConfirm)="vm.openConfirmDialog()"
  (confirmLiquidate)="vm.confirmLiquidate()"
/>
