<div class="min-h-screen flex flex-col" style="background: var(--ff-bg)">
  <!-- Navbar -->
  <header style="background: var(--ff-sidebar); border-bottom: 1px solid var(--ff-border)">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="font-mono font-bold text-lg" style="color: var(--ff-text-primary); letter-spacing: -0.03em">finFlow</span>
        <span class="text-xs font-semibold px-2 py-0.5 rounded uppercase tracking-wider" style="background: rgba(79,110,247,0.15); color: var(--ff-accent)">Portal Cliente</span>
      </div>
      <div class="flex items-center gap-3">
        @if (customer) {
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
               style="background: rgba(79,110,247,0.2); color: var(--ff-accent); border: 1px solid rgba(79,110,247,0.3); font-family: var(--ff-font-mono)">
            {{ initials }}
          </div>
          <span class="text-sm font-medium hidden sm:inline" style="color: var(--ff-text-secondary)">
            {{ customer.fullName }}
          </span>
        }
        <button
          type="button"
          (click)="logout()"
          class="text-xs font-medium px-3 py-1.5 rounded transition-all"
          style="border: 1px solid var(--ff-border); color: var(--ff-text-secondary); background: transparent"
          onmouseenter="this.style.color='var(--ff-text-primary)'; this.style.background='var(--ff-secondary)'"
          onmouseleave="this.style.color='var(--ff-text-secondary)'; this.style.background='transparent'"
        >
          <i class="pi pi-sign-out mr-1.5"></i>Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Aviso contraseña temporal -->
  @if (customer?.portalIsTempPassword) {
    <div class="px-4 py-2 text-sm" style="background: rgba(251,176,64,0.08); border-bottom: 1px solid rgba(251,176,64,0.25); color: var(--ff-warning)">
      <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <i class="pi pi-exclamation-triangle flex-shrink-0"></i>
          <span>Tu contraseña es temporal y debe ser cambiada.</span>
        </div>
        <a [routerLink]="changePasswordRoute"
           class="text-xs font-semibold whitespace-nowrap underline underline-offset-2 hover:opacity-75 transition-opacity"
           style="color: var(--ff-warning)">
          Cambiar ahora
        </a>
      </div>
    </div>
  }

  <!-- Contenido -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
    <router-outlet />
  </main>
</div>
