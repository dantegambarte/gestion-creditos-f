<p-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  header="Aprobar Crédito"
  [modal]="true"
  [style]="{ width: '440px', maxWidth: '95vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="flex flex-col gap-4 py-2">
    @if (usesFixedInstallments) {
      <div class="flex flex-col gap-1">
        <label class="auth-label">Cantidad de cuotas definida</label>
        <div
          class="w-full rounded-xl p-3 text-sm font-medium"
          style="border: 1px solid var(--ff-border); background: var(--ff-secondary); color: var(--ff-text-primary)"
        >
          {{ credit?.installmentsCount }} cuota(s)
        </div>
        <p class="text-xs" style="color: var(--ff-text-muted)">
          Se aprobará la operación con las cuotas ya definidas en la pre-operación.
        </p>
      </div>
    } @else {
      <div class="flex flex-col gap-1">
        <label class="auth-label">Cantidad de cuotas (puede ajustarse)</label>
        <input
          type="number"
          [(ngModel)]="installmentsCount"
          min="1"
          max="120"
          class="w-full rounded-xl p-3 text-sm outline-none"
          style="border: 1px solid var(--ff-border); background: var(--ff-secondary); color: var(--ff-text-primary)"
        />
      </div>
    }
  </div>
  <ng-template pTemplate="footer">
    <div class="grid grid-cols-2 gap-3 w-full">
      <p-button
        type="button"
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        styleClass="w-full h-11 px-5 rounded-xl justify-center"
        (onClick)="close()"
      />
      <p-button
        label="Confirmar"
        severity="primary"
        styleClass="w-full h-11 px-5 rounded-xl justify-center"
        (onClick)="confirm()"
        [loading]="processing"
        [disabled]="isCashClosed || processing"
        [pTooltip]="isCashClosed ? 'La caja está cerrada' : ''"
        tooltipPosition="top"
      />
    </div>
  </ng-template>
</p-dialog>
