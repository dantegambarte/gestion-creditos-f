<div class="ff-panel p-5 space-y-4">
  <h3 class="font-bold text-sm" style="color: var(--ff-text-primary)">
    {{ isEditMode ? "Editar unidad" : "Alta individual" }}
  </h3>
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="space-y-4">
      <div class="flex flex-col gap-1">
        <label
          class="text-xs font-bold uppercase tracking-wider"
          style="color: var(--ff-text-muted)"
        >
          Código de unidad
        </label>
        <input
          pInputText
          formControlName="unitCode"
          placeholder="IMEI-353456789012345"
          class="w-full h-11 ff-mono"
          [class.ng-invalid]="isInvalid('unitCode')"
        />
        @if (isInvalid("unitCode")) {
          <small style="color: var(--ff-danger)"
            >Código requerido (2-100 chars, A-Z0-9-_).</small
          >
        }
      </div>
      <div class="flex flex-col gap-1">
        <label
          class="text-xs font-bold uppercase tracking-wider"
          style="color: var(--ff-text-muted)"
        >
          Notas (opcional)
        </label>
        <textarea
          pInputTextarea
          formControlName="notes"
          rows="2"
          placeholder="Ej: Caja abierta, vidrio rayado..."
          class="w-full"
        ></textarea>
      </div>

      @if (errorMessage) {
        <p
          class="text-sm px-3 py-2 rounded-lg"
          style="color: var(--ff-danger); background: rgba(239, 68, 68, 0.1)"
        >
          {{ errorMessage }}
        </p>
      }

      <div class="pt-2 flex flex-col gap-2">
        <p-button
          type="submit"
          [label]="isEditMode ? 'Guardar cambios' : 'Registrar unidad'"
          severity="primary"
          styleClass="w-full justify-center h-11 rounded-xl"
          [loading]="submitting"
        />
        @if (isEditMode) {
          <p-button
            type="button"
            label="Cancelar edición"
            severity="secondary"
            [text]="true"
            styleClass="w-full justify-center h-9"
            (onClick)="editCancelled.emit()"
          />
        }
      </div>
    </div>
  </form>
</div>
