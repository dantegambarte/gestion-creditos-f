<header class="app-header">
  <!-- Izquierda: solo acciones contextuales -->
  <div class="flex items-center gap-3">
    @if (headerService.actions().length > 0) {
      <div class="flex items-center gap-2">
        @for (action of headerService.actions(); track action.label) {
          <p-button
            [label]="action.label"
            [icon]="action.icon ?? ''"
            [severity]="action.severity ?? 'secondary'"
            [outlined]="action.outlined ?? false"
            [styleClass]="
              'h-9 px-4 rounded-xl text-sm ' + (action.styleClass ?? '')
            "
            (onClick)="action.action()"
          />
        }
      </div>
    }
  </div>

  <!-- Derecha: fecha + En vivo + campana + usuario -->
  <div class="flex items-center gap-3">
    <span class="app-header__date hidden xl:block">{{ today }}</span>

    <!-- Indicador En vivo -->
    <div class="flex items-center gap-2">
      <span class="live-dot"></span>
      <span class="app-header__live-text">En vivo</span>
    </div>

    <!-- Campana -->
    <button class="app-header__bell">
      <i class="pi pi-bell text-lg"></i>
      <span class="app-header__bell-dot"></span>
    </button>

    <!-- Usuario -->
    @if (auth.currentUser$ | async; as user) {
      <div
        class="flex items-center gap-2 pl-3 app-header__user-section cursor-pointer hover:opacity-80 transition-opacity"
      >
        <div class="text-right hidden sm:block">
          <p class="app-header__user-name leading-none">{{ user.name }}</p>
          <p class="app-header__user-role mt-1 capitalize">{{ user.roles }}</p>
        </div>
        <div class="app-header__avatar">
          {{ user.name.charAt(0) }}
        </div>
      </div>
    }
  </div>
</header>
