<p-dialog
  header="Contraseña temporal generada"
  [visible]="visible"
  [closable]="true"
  [modal]="true"
  [style]="{ width: '38rem', maxWidth: '95vw' }"
  styleClass="temp-password-dialog"
  (onHide)="handleHide()"
  (visibleChange)="handleVisibleChange($event)"
>
  <div class="flex flex-col gap-4">
    <p class="text-sm text-[var(--ff-text-secondary)]">
      Esta contraseña se muestra <strong>una sola vez</strong>. Anotala y
      comunicala antes de cerrar este diálogo.
    </p>
    <div
      class="flex items-center gap-3 rounded-xl px-4 py-3"
      style="
        background: var(--ff-secondary);
        border: 1px solid var(--ff-border);
      "
    >
      <code
        class="flex-1 text-xl font-mono tracking-widest break-all select-all"
        style="color: var(--ff-text-primary)"
        >{{ password }}</code
      >
      <p-button
        icon="pi pi-copy"
        severity="primary"
        styleClass="h-11 w-11 rounded-lg"
        ariaLabel="Copiar contraseña temporal"
        (onClick)="copy()"
      />
    </div>
    @if (copySuccess) {
      <small class="text-green-600">¡Copiado!</small>
    }
    <button
      type="button"
      class="flex items-center justify-center gap-2 w-full h-11 px-5 rounded-xl font-medium text-white transition-opacity hover:opacity-90 active:opacity-80"
      style="background: #25D366;"
      (click)="sendWhatsApp()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 shrink-0">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.117.549 4.107 1.514 5.84L.057 23.428a.75.75 0 0 0 .916.914l5.656-1.476A11.934 11.934 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 0 1-5.016-1.377l-.36-.214-3.732.974.997-3.648-.235-.374A9.818 9.818 0 1 1 12 21.818z"/>
      </svg>
      Enviar por WhatsApp
    </button>
  </div>
  <ng-template pTemplate="footer">
    <p-button
      label="Ya la anoté y la comuniqué"
      icon="pi pi-check"
      severity="primary"
      styleClass="h-11 px-5 rounded-xl"
      (onClick)="confirm()"
    />
  </ng-template>
</p-dialog>
