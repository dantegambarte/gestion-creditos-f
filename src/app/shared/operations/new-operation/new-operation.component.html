<p-toast position="top-right" />
<div class="min-h-full bg-slate-900 text-slate-100">
  <div class="mx-auto max-w-7xl px-6 py-6 md:px-8 md:py-8">
    <div class="mb-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold tracking-tight md:text-2xl">
        Nueva Operación de Crédito
      </h1>
      <p-button
        icon="pi pi-times"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        routerLink="../"
        styleClass="text-slate-300"
      />
    </div>

    <div
      class="flex h-[calc(100vh-10rem)] flex-col rounded-2xl border border-slate-700 bg-slate-800 p-4 md:p-6"
    >
      <div
        class="flex-1 overflow-x-hidden overflow-y-auto rounded-xl border border-slate-700 bg-slate-900 p-5 md:p-7"
      >
        @switch (activeIndex) {
          @case (0) {
            <app-step-client
              [clients]="state.clients"
              [selectedClientId]="state.operationForm.controls.customerId.value"
              (clientSelected)="state.selectClient($event)"
            />
          }
          @case (1) {
            <app-step-products
              [form]="state.operationForm"
              [operationTypeOptions]="state.operationTypeOptions"
              [catalogProducts]="state.catalogProducts"
              [cartLines]="state.cartLines"
              [totalCarrito]="state.totalCarrito"
              [prestamoTotal]="state.prestamoTotal"
              [loadingLoanData]="state.loadingLoanData"
              [loadingSaleData]="state.loadingSaleData"
              [loadingProductRatesByCatalogId]="
                state.loadingProductRatesByCatalogId
              "
              (productAdded)="state.addProduct($event)"
              (productRemoved)="state.removeFromCart($event)"
              (quantityIncreased)="state.increaseQuantity($event)"
              (quantityDecreased)="state.decreaseQuantity($event)"
              (cartCleared)="state.clearCart()"
            />
          }
          @case (2) {
            <app-step-conditions
              [form]="state.operationForm"
              [cartLines]="state.cartLines"
              [paymentFrequencyOptions]="state.paymentFrequencyOptions"
              [installmentsOptions]="state.installmentsOptions"
              [isInstallmentsRefreshing]="state.isInstallmentsRefreshing"
              [capitalBase]="state.capitalBase"
              [capitalAFinanciar]="state.capitalAFinanciar"
              [interestRate]="state.interestRate"
              [valorCuota]="state.valorCuota"
              [totalADevolver]="state.totalADevolver"
              [todayDate]="state.todayDate"
              [installmentsDropdownClass]="state.installmentsDropdownClass"
              [validatedDownPayment]="state.getValidatedDownPayment()"
              (saleInstallmentsChanged)="
                state.onSaleInstallmentsChange(
                  $event.productoId,
                  $event.installments
                )
              "
            />
          }
          @case (3) {
            <app-step-confirm
              [form]="state.operationForm"
              [selectedClient]="state.selectedClient()"
              [cartLines]="state.cartLines"
              [capitalAFinanciar]="state.capitalAFinanciar"
              [valorCuota]="state.valorCuota"
              [totalADevolver]="state.totalADevolver"
              [validatedDownPayment]="state.getValidatedDownPayment()"
              [installmentsCount]="
                state.operationForm.controls.installmentsCount.value
              "
            />
          }
        }
      </div>

      <div
        class="mt-4 flex items-center justify-between border-t border-slate-700 pt-4"
      >
        <span class="text-sm text-slate-400"
          >Paso {{ activeIndex + 1 }} de 4 ·
          {{ steps[activeIndex]?.label }}</span
        >

        <div class="flex items-center gap-3">
          @if (activeIndex === 0) {
            <p-button
              label="Cancelar"
              severity="secondary"
              [outlined]="true"
              routerLink="../"
              styleClass="h-11 px-5 rounded-xl"
              data-cy="btn-cancelar"
            />
          } @else {
            <p-button
              label="Anterior"
              icon="pi pi-arrow-left"
              severity="secondary"
              [outlined]="true"
              (onClick)="prevStep()"
              styleClass="h-11 px-5 rounded-xl"
              data-cy="btn-anterior"
            />
          }

          @if (activeIndex < 3) {
            <p-button
              label="Siguiente"
              icon="pi pi-arrow-right"
              iconPos="right"
              severity="primary"
              [disabled]="!state.canNext(activeIndex)"
              (onClick)="nextStep()"
              styleClass="h-11 px-6 rounded-xl"
              data-cy="btn-siguiente"
            />
          } @else {
            <p-button
              label="Enviar para Aprobación"
              icon="pi pi-check"
              severity="success"
              data-cy="btn-enviar-aprobacion"
              [disabled]="!state.canSubmitOperation"
              [loading]="state.submitting"
              (onClick)="submitOperation()"
              styleClass="h-11 px-6 rounded-xl"
            />
          }
        </div>
      </div>
    </div>
  </div>
</div>
