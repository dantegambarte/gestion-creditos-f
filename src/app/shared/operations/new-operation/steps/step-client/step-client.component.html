<section class="flex h-full flex-col gap-5">
  <h2 class="text-lg font-semibold">Paso 1 · Cliente</h2>

  <div class="space-y-2">
    <label class="text-sm font-medium text-slate-300">Buscar cliente</label>
    <input
      pInputText
      [(ngModel)]="searchText"
      class="h-11 w-full rounded-xl border border-slate-600 bg-slate-800 px-3 text-slate-100"
      placeholder="DNI, nombre o apellido"
      data-cy="input-search-client"
    />
  </div>

  <div class="min-h-0 flex-1 overflow-y-auto pr-1">
    <div class="grid gap-3 md:grid-cols-2">
      @for (client of filteredClients; track client.id) {
        <button
          type="button"
          [class]="selectedClientId === client.id
            ? 'rounded-xl border border-emerald-500 bg-emerald-900/30 p-4 text-left transition'
            : 'rounded-xl border border-slate-700 bg-slate-800 p-4 text-left transition'"
          (click)="clientSelected.emit(client)"
          [attr.data-cy]="'client-card-' + client.id"
        >
          <div class="flex items-center justify-between">
            <div class="font-medium">{{ client.name }}</div>
            <span
              [class]="client.status === 'ACTIVE'
                ? 'rounded-full bg-emerald-500/20 px-2 py-1 text-xs text-emerald-300'
                : 'rounded-full bg-red-500/20 px-2 py-1 text-xs text-red-300'"
            >
              {{ client.status === 'ACTIVE' ? 'ACTIVO' : 'INACTIVO' }}
            </span>
          </div>
          <div class="mt-2 text-sm text-slate-400">DNI: {{ client.dni }}</div>
        </button>
      }
    </div>
  </div>

  @if (isSelectedClientInactive) {
    <p class="text-sm text-red-400">
      El cliente seleccionado está inactivo. No podés avanzar.
    </p>
  }
</section>
