<div class="mx-auto mt-10 w-[800px] max-w-full">
  <div class="mb-10 text-center">
    <h2 class="mb-3 text-2xl font-semibold text-[var(--ff-text-primary)]">
      ¿Qué tipo de operación deseas registrar?
    </h2>
    <p class="text-[15px] text-[var(--ff-text-secondary)]">
      Selecciona la modalidad para configurar el crédito y los planes de pago.
    </p>
  </div>

  <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
    <button
      type="button"
      data-cy="btn-type-sale"
      class="group flex flex-col items-center rounded-2xl border border-[var(--ff-border-subtle)] bg-[var(--ff-panel)] p-8 text-left transition-all hover:border-[#3B82F6] hover:bg-[var(--ff-surface-hover)]"
      (click)="selectType('SALE')"
    >
      <div
        class="mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-[#3B82F6]/10 transition-transform group-hover:scale-110"
      >
        <i class="pi pi-shopping-cart text-[#3B82F6] text-2xl"></i>
      </div>
      <h3 class="mb-2 text-lg font-semibold text-[var(--ff-text-primary)]">
        Venta de Productos
      </h3>
      <p
        class="text-center text-[14px] leading-relaxed text-[var(--ff-text-secondary)]"
      >
        Financia artículos del inventario con sus respectivas tasas y
        condiciones.
      </p>
    </button>

    <button
      type="button"
      data-cy="btn-type-loan"
      class="group flex flex-col items-center rounded-2xl border border-[var(--ff-border-subtle)] bg-[var(--ff-panel)] p-8 text-left transition-all hover:border-[#10B981] hover:bg-[var(--ff-surface-hover)]"
      (click)="selectType('LOAN')"
    >
      <div
        class="mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-[#10B981]/10 transition-transform group-hover:scale-110"
      >
        <i class="pi pi-money-bill text-[#10B981] text-2xl"></i>
      </div>
      <h3 class="mb-2 text-lg font-semibold text-[var(--ff-text-primary)]">
        Préstamo Efectivo
      </h3>
      <p
        class="text-center text-[14px] leading-relaxed text-[var(--ff-text-secondary)]"
      >
        Otorgamiento de capital en efectivo directo con plan de cuotas.
      </p>
    </button>
  </div>
</div>
