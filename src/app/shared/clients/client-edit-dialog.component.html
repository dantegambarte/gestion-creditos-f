<p-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '480px' }"
  header="Editar Cliente"
>
  <form [formGroup]="editForm" class="flex flex-col gap-4 py-2">
    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label class="auth-label">Nombre</label>
        <input pInputText formControlName="nombre" class="client-input" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="auth-label">Apellido</label>
        <input pInputText formControlName="apellido" class="client-input" />
      </div>
    </div>
    <div class="flex flex-col gap-1">
      <label class="auth-label">Teléfono</label>
      <input pInputText formControlName="phone" class="client-input" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="auth-label">Email</label>
      <input
        pInputText
        formControlName="email"
        placeholder="ejemplo@correo.com"
        [class]="'client-input' + (isEditInvalid('email') ? ' client-input--error' : '')"
      />
      @if (isEditInvalid('email')) {
        <span class="auth-error">{{ getEditError('email') }}</span>
      }
    </div>
    <div class="flex flex-col gap-1">
      <label class="auth-label">Dirección</label>
      <input pInputText formControlName="direccion" placeholder="Ej: Av. Corrientes 1234" class="client-input" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="auth-label">Cobrador asignado</label>
      <p-dropdown
        formControlName="assignedCollectorId"
        [options]="collectorOptions"
        optionLabel="label"
        optionValue="value"
        [placeholder]="collectorsLoading ? 'Cargando cobradores…' : 'Seleccionar cobrador'"
        [disabled]="collectorsLoading"
        [showClear]="true"
        styleClass="w-full"
        appendTo="body"
      />
    </div>
    @if (editError) {
      <p class="text-sm text-red-500">{{ editError }}</p>
    }
  </form>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3 pt-2">
      <p-button
        type="button"
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        styleClass="h-11 px-5 rounded-xl justify-center"
        (onClick)="visibleChange.emit(false)"
      />
      <p-button
        label="Guardar Cambios"
        icon="pi pi-save"
        severity="primary"
        styleClass="h-11 px-5 rounded-xl"
        [disabled]="editForm.invalid"
        (onClick)="saveEdit()"
      />
    </div>
  </ng-template>
</p-dialog>
