<p-toast />
<div
  class="sr-only"
  aria-live="polite"
  aria-atomic="true"
  data-cy="global-live-region"
>
  {{ liveAnnouncement }}
</div>
@if (!isPortalRoute() && (auth.currentUser$ | async)) {
  <div class="ff-shell">
    <sidebar />
    <div class="ff-shell__content">
      <app-header />
      <main class="ff-shell__main">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}
