name: CI

# Runs only what a PR touched; the full suite runs on main, nightly,
# when shared code changes, or when the PR has the `ci:full` label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; main and nightly runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # --no-renames lists both the old and new path of a moved file.
            git diff --name-only --no-renames "$BASE_SHA"...HEAD > changed.txt
          else
            : > changed.txt
          fi
          FLAG=""
          if [ "$EVENT" != "pull_request" ] || [ "$FORCE_LABEL" = "true" ]; then FLAG="--full"; fi
          node scripts/ci-scope.mjs $FLAG < changed.txt > scope.json
          cat scope.json
          echo "mode=$(node -p "require('./scope.json').mode")" >> "$GITHUB_OUTPUT"

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.scope.outputs.mode != 'none'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.mode != 'none'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.scope.outputs.mode != 'none'
        run: pnpm install --frozen-lockfile

      - name: Scope script tests
        if: steps.scope.outputs.mode != 'none'
        run: pnpm test:scope

      - name: Lint changed files
        if: steps.scope.outputs.mode != 'none'
        run: |
          FILES=$(node -p "require('./scope.json').lintFiles.filter(f => require('fs').existsSync(f)).join(' ')")
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Lint runs only on PR diffs (incremental adoption)."
          elif [ -n "$FILES" ]; then
            pnpm exec eslint --max-warnings 0 $FILES
          else
            echo "No lintable files changed."
          fi

      - name: Unit tests (full, with coverage threshold)
        if: steps.scope.outputs.mode == 'full'
        run: pnpm test:ci

      - name: Unit tests (affected features)
        if: steps.scope.outputs.mode == 'affected'
        run: |
          ARGS=$(node -p "require('./scope.json').includes.map(i => '--include=' + i).join(' ')")
          pnpm exec ng test --watch=false --browsers=ChromeHeadlessCI $ARGS

  nightly-report:
    name: Report nightly failure
    needs: checks
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Nightly CI failing';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci:nightly',
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body: `Still failing: ${run}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, labels: ['ci:nightly'], body: `The nightly full suite failed: ${run}`,
              });
            }
