name: E2E

# Full Cypress suite against a throwaway Postgres and the backend's main branch.
# Too slow for every PR: runs nightly, on demand, and on PRs labelled `ci:e2e`.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      spec:
        description: 'Optional spec glob (empty runs the whole suite)'
        required: false
        default: ''
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: America/Argentina/Buenos_Aires

jobs:
  cypress:
    name: Cypress (full suite)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestion_creditos_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_e2e
          TZ: America/Argentina/Buenos_Aires
          PGTZ: America/Argentina/Buenos_Aires
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestion_creditos_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Throwaway values for a disposable database; never production secrets.
    env:
      PORT: '3000'
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: gestion_creditos_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres_e2e
      JWT_SECRET_INTERNAL: ci-e2e-internal-secret-not-for-production
      JWT_SECRET_PORTAL: ci-e2e-portal-secret-not-for-production
      ALLOWED_ORIGINS: http://localhost:4200
      DISABLE_LOGIN_RATE_LIMIT: 'true'
      ENABLE_TEST_ROUTES: 'true'
      E2E_API_BASE: http://localhost:3000/api
      E2E_BACKEND_DIR: ${{ github.workspace }}/backend
      # Test-seed users from the public backend seeds (01_admin, 05_e2e).
      CYPRESS_realAdminDni: '00000000'
      CYPRESS_realAdminPassword: Admin1234
      CYPRESS_realSellerDni: '11111111'
      CYPRESS_realSellerPassword: '123456'
      CYPRESS_realCollectorDni: '22222222'
      CYPRESS_realCollectorPassword: '123456'
      CYPRESS_realSellerCollectorDni: '33333333'
      CYPRESS_realSellerCollectorPassword: '123456'
      CYPRESS_realPortalDni: '40567890'
      CYPRESS_realPortalPassword: '1234'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Claudiogonzalezok/gestion_creditos_backend
          ref: main
          path: backend
          persist-credentials: false

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend
        run: pnpm install --frozen-lockfile

      - name: Install backend
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Migrate and seed
        working-directory: backend
        run: |
          pnpm run migration:run
          pnpm run seed
          # The admin seed forces a password change; the suite logs in directly.
          PGPASSWORD="$DB_PASSWORD" psql -h localhost -U postgres -d "$DB_NAME" \
            -c "UPDATE users SET is_temp_password = FALSE WHERE dni = '00000000'"

      - name: Start backend
        working-directory: backend
        run: nohup node src/app.js > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Start frontend
        run: nohup pnpm exec ng serve --host 0.0.0.0 --port 4200 > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Wait for servers
        run: |
          for url in http://localhost:3000/api http://localhost:4200; do
            for i in $(seq 1 120); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$code" != "000" ]; then echo "$url -> $code"; break; fi
              if [ "$i" = 120 ]; then echo "$url never came up"; exit 1; fi
              sleep 2
            done
          done

      - name: Run Cypress
        env:
          SPEC: ${{ github.event.inputs.spec }}
        run: pnpm exec cypress run ${SPEC:+--spec "$SPEC"}

      - name: Server logs
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/backend.log" || true
          tail -n 100 "$RUNNER_TEMP/frontend.log" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/reports/mocha
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          if-no-files-found: ignore
          retention-days: 7
